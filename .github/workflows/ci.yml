name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint backend
        run: python -m ruff check .
      - name: Run backend tests
        run: python -m pytest -v

  data-pipeline:
    name: Data pipeline tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data_pipeline/requirements-dev.txt
      - name: Install pipeline development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint data pipeline
        run: python -m ruff check .
      - name: Run data pipeline tests
        run: python -m pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
