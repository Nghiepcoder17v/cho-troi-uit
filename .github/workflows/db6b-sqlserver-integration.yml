name: DB-6B SQL Server integration

on:
  pull_request:
    paths:
      - "backend/**"
      - "database_scripts/**"
      - ".github/workflows/db6b-sqlserver-integration.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database_scripts/**"
      - ".github/workflows/db6b-sqlserver-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db6b-sqlserver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-reports:
    name: Product report schema and API integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ format('UIT-CI-{0}-Aa9!', github.run_id) }}
        ports:
          - 1433:1433
    env:
      RUN_SQLSERVER_INTEGRATION: "1"
      SQLSERVER_TEST_DATABASE_URL: "mssql+pyodbc://sa:${{ format('UIT-CI-{0}-Aa9%21', github.run_id) }}@127.0.0.1:1433/ChoTroUIT_DB6B_Test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Ensure Microsoft ODBC Driver 18 is installed
        run: |
          if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Wait for SQL Server and create isolated test database
        env:
          MSSQL_SA_PASSWORD: ${{ format('UIT-CI-{0}-Aa9!', github.run_id) }}
        run: |
          set -euo pipefail
          container_id="${{ job.services.sqlserver.id }}"
          sqlcmd="/opt/mssql-tools18/bin/sqlcmd"
          ready=""

          for attempt in $(seq 1 60); do
            if docker exec "$container_id" "$sqlcmd" \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" \
              >/dev/null 2>&1; then
              ready="yes"
              break
            fi
            sleep 2
          done

          if [[ "$ready" != "yes" ]]; then
            docker logs "$container_id"
            exit 1
          fi

          docker exec "$container_id" "$sqlcmd" \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
            -Q "IF DB_ID(N'ChoTroUIT_DB6B_Test') IS NULL CREATE DATABASE ChoTroUIT_DB6B_Test"

      - name: Apply base schema only to the disposable test database
        env:
          MSSQL_SA_PASSWORD: ${{ format('UIT-CI-{0}-Aa9!', github.run_id) }}
        run: |
          set -euo pipefail
          container_id="${{ job.services.sqlserver.id }}"
          docker cp database_scripts/01_init_schema.sql \
            "$container_id:/tmp/01_init_schema.sql"
          docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
            -d ChoTroUIT_DB6B_Test -i /tmp/01_init_schema.sql

      - name: Apply additive migrations twice to verify idempotency
        env:
          MSSQL_SA_PASSWORD: ${{ format('UIT-CI-{0}-Aa9!', github.run_id) }}
        run: |
          set -euo pipefail
          container_id="${{ job.services.sqlserver.id }}"
          for migration in \
            database_scripts/migrations/20261113_user_favorites.sql \
            database_scripts/migrations/20261113_product_reports.sql \
            database_scripts/migrations/20261113_db6c_moderation.sql \
            database_scripts/migrations/20261113_db6d_role_assignment_events.sql; do
            docker cp "$migration" "$container_id:/tmp/$(basename "$migration")"
            for attempt in 1 2; do
              docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b \
                -d ChoTroUIT_DB6B_Test -i "/tmp/$(basename "$migration")"
            done
          done

      - name: Run DB-6B SQL Server integration tests
        working-directory: backend
        run: python -m pytest -v tests/test_reporting_sqlserver_integration.py
